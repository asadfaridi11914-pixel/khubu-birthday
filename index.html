<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday!</title>

  <!-- Fonts (need internet; the page still works without them) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body data-theme="lavender">

  <!-- Floating balloons in the background (created by script.js) -->
  <div class="balloons" id="balloons" aria-hidden="true"></div>

  <!-- Cover screen: the tap here is what lets the music start -->
  <div class="cover" id="cover">
    <p class="hand" id="coverFrom"></p>
    <h1 id="coverTitle"></h1>
    <button class="btn" id="openBtn">Open your surprise</button>
    <p class="cover-hint">Turn your sound on</p>
  </div>

  <!-- The slideshow -->
  <main class="stage" id="stage" hidden>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <button class="music-btn" id="musicBtn" aria-pressed="true">Music: on</button>

    <div class="slides" id="slides"></div>

    <nav class="controls" aria-label="Slide navigation">
      <button class="nav-btn" id="prevBtn" aria-label="Previous slide">&#8249;</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn" id="nextBtn" aria-label="Next slide">&#8250;</button>
    </nav>
  </main>

  <!-- Background music -->
  <audio id="bgm" loop preload="auto"></audio>

  <!-- Confetti layer -->
  <canvas id="confetti"></canvas>

  <script src="script.js"></script>
</body>
</html>
